<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню рационов — NutriWeek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">NutriWeek</a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="menu.html" class="active">Меню</a>
      </nav>
      <button class="cart-btn" onclick="openCart()">
        🛒 <span class="cart-count">0</span>
      </button>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Меню рационов</h1>

      <!-- Filters -->
      <div class="filters">
        <label>Цель:</label>
        <button class="filter-btn active" data-filter="goal" onclick="setGoalFilter('all', this)">Все</button>
        <button class="filter-btn" data-filter="goal" onclick="setGoalFilter('weight-loss', this)">Похудение</button>
        <button class="filter-btn" data-filter="goal" onclick="setGoalFilter('gain', this)">Набор массы</button>
        <button class="filter-btn" data-filter="goal" onclick="setGoalFilter('vegan', this)">Веган</button>
        <button class="filter-btn" data-filter="goal" onclick="setGoalFilter('maintain', this)">Поддержание</button>

        <label style="margin-left:16px">Ккал:</label>
        <button class="filter-btn active" data-filter="kcal" onclick="setKcalFilter('all', this)">Все</button>
        <button class="filter-btn" data-filter="kcal" onclick="setKcalFilter('1200', this)">1200</button>
        <button class="filter-btn" data-filter="kcal" onclick="setKcalFilter('1400', this)">1400</button>
        <button class="filter-btn" data-filter="kcal" onclick="setKcalFilter('1800', this)">1800</button>
        <button class="filter-btn" data-filter="kcal" onclick="setKcalFilter('2000', this)">2000</button>
        <button class="filter-btn" data-filter="kcal" onclick="setKcalFilter('2500', this)">2500</button>
        <button class="filter-btn" data-filter="kcal" onclick="setKcalFilter('2800', this)">2800</button>
      </div>

      <div class="products-grid" id="products-grid">
        <!-- filled by JS -->
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© 2026 NutriWeek • Готовые рационы с доставкой</span>
      <a href="tel:+79991234567">+7 (999) 123-45-67</a>
    </div>
  </footer>

  <!-- Cart -->
  <div class="cart-overlay" id="cart-overlay">
    <div class="cart-drawer">
      <div class="cart-header">
        <h2>Корзина</h2>
        <button class="cart-close" onclick="closeCart()">×</button>
      </div>
      <div class="cart-body" id="cart-body"></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Итого</span>
          <span class="sum" id="cart-total-sum">0 ₽</span>
        </div>
        <button class="btn btn-primary" onclick="showToast('Заказ оформлен! (демо)')">Оформить заказ</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
